<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React Query Devtools retention reproduction</title>
  </head>
  <body>
    <main>
      <h1>React Query Devtools retention</h1>
      <label>Elements <input id="count" type="number" value="1000" min="1" max="5000" /></label>
      <div class="actions">
        <button id="control">Run control</button>
        <button id="stopped">Run stopped events</button>
        <button id="reload">Reload</button>
      </div>
      <output id="status" aria-live="polite">Ready</output>
      <pre id="result"></pre>
    </main>
    <div id="targets"></div>
    <div id="react-root"></div>
    <script type="module" src="/src/react.js"></script>
  </body>
</html>
